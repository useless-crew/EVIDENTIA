# Evidentia — Local Development Infrastructure
#
# Brings up the backend and every infrastructure dependency it needs:
# PostgreSQL, Redis, and MinIO. The frontend is included as a placeholder
# only — see frontend/README.md; it is not built as part of this file.
#
# This file publishes NO host ports on its own — see
# docker-compose.override.yml (auto-loaded together with this file
# whenever `docker compose` is run with no `-f` flag, which is standard
# Compose behavior) for the local-dev convenience port bindings
# (`localhost:8080`, `:5432`, `:6379`, `:9000`/`:9001`). For a
# production-like deployment (reverse proxy, TLS, a real frontend build,
# a separate worker) see docker-compose.prod.yml and
# docs/DEPLOYMENT.md — run that ALONGSIDE this file (`-f
# docker-compose.yml -f docker-compose.prod.yml`), which does NOT load
# the override file, so none of these services publish a host port
# except that deployment's own reverse proxy.
#
# Every credential below (POSTGRES_PASSWORD, MINIO_ROOT_PASSWORD, ...) falls
# back to an obvious, documented placeholder (see .env.example) so this
# file works out of the box for local development with no setup. This is
# NOT a relaxation of "never default credentials": that rule is enforced by
# the Go application itself (internal/config), which still refuses to start
# if DATABASE_PASSWORD/MINIO_SECRET_KEY/etc. are empty — a real deployment
# sets its own .env (gitignored, never committed) to override these.
#
# Quick start:
#   docker compose up -d postgres redis minio
#   cd backend && DATABASE_MIGRATOR_USER=evidentia DATABASE_MIGRATOR_PASSWORD=changeme_example \
#     DATABASE_HOST=localhost DATABASE_NAME=evidentia go run ./cmd/migrate up
#   cd .. && docker compose up -d
#   curl http://localhost:8080/health
#   curl http://localhost:8080/ready
#
# The migration step creates the evidentia_app role the backend container
# connects as (see docs/DATABASE_SCHEMA.md) — the backend cannot start
# without it. It only needs to be run once per postgres_data volume.
#
# To use real (non-placeholder) credentials instead:
#   cp .env.example .env      # then edit POSTGRES_PASSWORD / MINIO_ROOT_PASSWORD
#   docker compose up -d

services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: evidentia-backend
      APP_VERSION: ${APP_VERSION:-dev}

      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080

      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      # evidentia_app — NOT ${POSTGRES_USER}, which is the migration-only
      # superuser (see docs/DATABASE_SCHEMA.md). This role and its
      # password are created by backend/db/migrations/000001_init_schema
      # .up.sql, so migrations must be applied (`make migrate-up`) before
      # this container can connect — see the Quick Start above.
      DATABASE_USER: evidentia_app
      DATABASE_PASSWORD: changeme_example
      DATABASE_NAME: ${POSTGRES_DB:-evidentia}
      DATABASE_SSLMODE: disable

      REDIS_ADDR: redis:6379
      # Matches the redis service's --requirepass below (System 15) — both
      # fall back to the same placeholder, same convention as every other
      # credential in this file (see the header comment).
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme_example}

      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-evidentia_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-changeme_example}
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: ${MINIO_BUCKET:-evidentia-documents}

      # Max size, in bytes, of a single uploaded evidence file (System 6)
      # — independent of any request-body limit used elsewhere. 50 MiB
      # default; override for real evidence-file sizing.
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-52428800}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}

      JWT_ISSUER: ${JWT_ISSUER:-evidentia-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-evidentia-client}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}
      # Placeholder, same convention as every other credential in this
      # file (see the header comment) — internal/config requires it be at
      # least 32 characters; this is exactly 44. Override JWT_SIGNING_KEY
      # for anything beyond throwaway local dev.
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-changeme_example_jwt_signing_key_pad_to_32}
      BCRYPT_COST: ${BCRYPT_COST:-12}

      # Compliance-certificate signing (System 7) — a PEM-encoded PKCS#8
      # ECDSA private key. Deliberately left EMPTY by default (never a
      # baked-in placeholder key, unlike JWT_SIGNING_KEY above): unset is
      # a valid, intentional configuration — service.NewCertificateService
      # falls back to a fresh, process-lifetime-only key rather than
      # refusing to start (see that constructor's doc comment). Set
      # CERTIFICATE_SIGNING_KEY for certificates that must remain
      # verifiable across a container restart. NEVER commit a real key
      # here or anywhere else.
      CERTIFICATE_SIGNING_KEY: ${CERTIFICATE_SIGNING_KEY:-}

      # Initial-admin bootstrap (System 8, internal/bootstrap) — deliberately
      # EMPTY by default, same convention as CERTIFICATE_SIGNING_KEY above:
      # unset is a valid, intentional configuration (the bootstrap is a
      # no-op with nothing to skip past — see EnsureBootstrapAdmin's doc
      # comment), never a baked-in placeholder admin. Set all three in your
      # own (gitignored) .env for the FIRST `docker compose up` against a
      # fresh database only; leave unset afterward. NEVER commit real
      # values here or anywhere else.
      EVIDENTIA_BOOTSTRAP_ADMIN_EMAIL: ${EVIDENTIA_BOOTSTRAP_ADMIN_EMAIL:-}
      EVIDENTIA_BOOTSTRAP_ADMIN_PASSWORD: ${EVIDENTIA_BOOTSTRAP_ADMIN_PASSWORD:-}
      EVIDENTIA_BOOTSTRAP_ADMIN_NAME: ${EVIDENTIA_BOOTSTRAP_ADMIN_NAME:-}
    # No `ports:` here (System 17) — see docker-compose.override.yml,
    # which `docker compose up` with no `-f` flags loads automatically
    # for local development's convenience host-port bindings. Running the
    # production overlay (docker-compose.prod.yml) explicitly instead —
    # `-f docker-compose.yml -f docker-compose.prod.yml` — does NOT
    # auto-load docker-compose.override.yml, so backend/postgres/redis/
    # minio publish no host port at all in that mode: only
    # docker-compose.prod.yml's `reverse-proxy` service does. Compose
    # merges a re-specified `ports:` list as a UNION across files, never
    # a replacement, so removing this from the override file was the
    # only way to make "no host port in production" actually true — see
    # docker-compose.prod.yml's own header comment.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Gated behind the "frontend" Compose profile so a backend-only local
  # dev session (`docker compose up`, no profile set) skips building/
  # starting it — see frontend/README.md. frontend/Dockerfile (System 17)
  # builds the real production Angular bundle behind Nginx; this base
  # service is still useful stand-alone for previewing that build without
  # the full docker-compose.prod.yml reverse-proxy stack. No `ports:`
  # here — see docker-compose.override.yml (auto-loaded for local dev)
  # and backend's own comment above for why.
  frontend:
    build:
      context: ./frontend
    profiles: ["frontend"]

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evidentia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_example}
      POSTGRES_DB: ${POSTGRES_DB:-evidentia}
    # No `ports:` here (System 17 — see docker-compose.override.yml,
    # loaded automatically for local dev, and backend's own comment above
    # for why): postgres is internal infrastructure the backend/migrator
    # reach over the compose network and must never be reachable from
    # outside a production deployment. Local dev still reaches it at
    # localhost:${POSTGRES_PORT} for the Quick Start's host-run migrate
    # step below, via the auto-loaded override file.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evidentia} -d ${POSTGRES_DB:-evidentia}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-evidentia_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme_example}
    command: server /data --console-address ":9001"
    # No `ports:` here (System 17 — see docker-compose.override.yml and
    # backend's own comment above): MinIO is internal object storage the
    # backend reaches over the compose network. Nothing in this project
    # issues pre-signed MinIO URLs to a browser (see docs/STORAGE.md/
    # SECURITY.md — every download streams through the backend), so
    # there is no legitimate reason for either the S3 API port or the
    # admin console to be reachable outside a production deployment;
    # local dev still reaches both via the auto-loaded override file.
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7
    # --requirepass (System 15): Redis is internal queue/pub-sub/rate-limit
    # infrastructure (Asynq, SSE fan-out, internal/ratelimit) — even bound
    # to loopback only (below), requiring a password is cheap defense in
    # depth against any other process/user on the same host. Same
    # placeholder-credential convention as every other service in this
    # file (see the header comment); the backend's REDIS_PASSWORD above
    # must match.
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_example}
    # No `ports:` here (System 17 — see docker-compose.override.yml and
    # backend's own comment above): must never be reachable outside a
    # production deployment regardless of the password above; local dev
    # still reaches it via the auto-loaded override file.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_example}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  redis_data:
