# Evidentia — Local Development Infrastructure
#
# Brings up the backend and every infrastructure dependency it needs:
# PostgreSQL, Redis, and MinIO. The frontend is included as a placeholder
# only — see frontend/README.md; it is not built as part of this system.
#
# Every credential below (POSTGRES_PASSWORD, MINIO_ROOT_PASSWORD, ...) falls
# back to an obvious, documented placeholder (see .env.example) so this
# file works out of the box for local development with no setup. This is
# NOT a relaxation of "never default credentials": that rule is enforced by
# the Go application itself (internal/config), which still refuses to start
# if DATABASE_PASSWORD/MINIO_SECRET_KEY/etc. are empty — a real deployment
# sets its own .env (gitignored, never committed) to override these.
#
# Quick start:
#   docker compose up -d postgres redis minio
#   cd backend && DATABASE_MIGRATOR_USER=evidentia DATABASE_MIGRATOR_PASSWORD=changeme_example \
#     DATABASE_HOST=localhost DATABASE_NAME=evidentia go run ./cmd/migrate up
#   cd .. && docker compose up -d
#   curl http://localhost:8080/health
#   curl http://localhost:8080/ready
#
# The migration step creates the evidentia_app role the backend container
# connects as (see docs/DATABASE_SCHEMA.md) — the backend cannot start
# without it. It only needs to be run once per postgres_data volume.
#
# To use real (non-placeholder) credentials instead:
#   cp .env.example .env      # then edit POSTGRES_PASSWORD / MINIO_ROOT_PASSWORD
#   docker compose up -d

services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: evidentia-backend
      APP_VERSION: ${APP_VERSION:-dev}

      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080

      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      # evidentia_app — NOT ${POSTGRES_USER}, which is the migration-only
      # superuser (see docs/DATABASE_SCHEMA.md). This role and its
      # password are created by backend/db/migrations/000001_init_schema
      # .up.sql, so migrations must be applied (`make migrate-up`) before
      # this container can connect — see the Quick Start above.
      DATABASE_USER: evidentia_app
      DATABASE_PASSWORD: changeme_example
      DATABASE_NAME: ${POSTGRES_DB:-evidentia}
      DATABASE_SSLMODE: disable

      REDIS_ADDR: redis:6379

      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-evidentia_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-changeme_example}
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: ${MINIO_BUCKET:-evidentia-documents}

      # Max size, in bytes, of a single uploaded evidence file (System 6)
      # — independent of any request-body limit used elsewhere. 50 MiB
      # default; override for real evidence-file sizing.
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-52428800}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}

      JWT_ISSUER: ${JWT_ISSUER:-evidentia-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-evidentia-client}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}
      # Placeholder, same convention as every other credential in this
      # file (see the header comment) — internal/config requires it be at
      # least 32 characters; this is exactly 44. Override JWT_SIGNING_KEY
      # for anything beyond throwaway local dev.
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-changeme_example_jwt_signing_key_pad_to_32}
      BCRYPT_COST: ${BCRYPT_COST:-12}

      # Compliance-certificate signing (System 7) — a PEM-encoded PKCS#8
      # ECDSA private key. Deliberately left EMPTY by default (never a
      # baked-in placeholder key, unlike JWT_SIGNING_KEY above): unset is
      # a valid, intentional configuration — service.NewCertificateService
      # falls back to a fresh, process-lifetime-only key rather than
      # refusing to start (see that constructor's doc comment). Set
      # CERTIFICATE_SIGNING_KEY for certificates that must remain
      # verifiable across a container restart. NEVER commit a real key
      # here or anywhere else.
      CERTIFICATE_SIGNING_KEY: ${CERTIFICATE_SIGNING_KEY:-}

      # Initial-admin bootstrap (System 8, internal/bootstrap) — deliberately
      # EMPTY by default, same convention as CERTIFICATE_SIGNING_KEY above:
      # unset is a valid, intentional configuration (the bootstrap is a
      # no-op with nothing to skip past — see EnsureBootstrapAdmin's doc
      # comment), never a baked-in placeholder admin. Set all three in your
      # own (gitignored) .env for the FIRST `docker compose up` against a
      # fresh database only; leave unset afterward. NEVER commit real
      # values here or anywhere else.
      EVIDENTIA_BOOTSTRAP_ADMIN_EMAIL: ${EVIDENTIA_BOOTSTRAP_ADMIN_EMAIL:-}
      EVIDENTIA_BOOTSTRAP_ADMIN_PASSWORD: ${EVIDENTIA_BOOTSTRAP_ADMIN_PASSWORD:-}
      EVIDENTIA_BOOTSTRAP_ADMIN_NAME: ${EVIDENTIA_BOOTSTRAP_ADMIN_NAME:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Placeholder only — the frontend is not built or wired up in this
  # system. See frontend/README.md for the Angular app it will eventually
  # serve.
  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    profiles: ["frontend"]
    # TODO: add a Dockerfile under frontend/ once the frontend is built.

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evidentia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_example}
      POSTGRES_DB: ${POSTGRES_DB:-evidentia}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evidentia} -d ${POSTGRES_DB:-evidentia}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-evidentia_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme_example}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  redis_data:
