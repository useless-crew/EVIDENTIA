# Evidentia — AWS Deployment Pipeline
#
# Builds Docker images, pushes to ECR with immutable SHA-based tags,
# runs database migrations, and deploys to ECS Fargate.
# Frontend is built and deployed to S3 + CloudFront.
#
# Triggered on push to main (after CI passes) or manual workflow_dispatch.
# Production deployments require manual approval via GitHub Environment protection rules.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - demo
          - staging
          - production
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC for AWS authentication
  contents: read

jobs:
  # -------------------------------------------------------------------
  # Build & Push Docker Images to Amazon ECR
  # -------------------------------------------------------------------
  build-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      api_image: ${{ steps.meta.outputs.api_image }}
      worker_image: ${{ steps.meta.outputs.worker_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute immutable image tag
        id: meta
        run: |
          TAG="sha-$(echo ${{ github.sha }} | cut -c1-8)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "api_image=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/evidentia-api:$TAG" >> "$GITHUB_OUTPUT"
          echo "worker_image=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/evidentia-worker:$TAG" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Tag API image
        run: |
          docker build \
            --file backend/Dockerfile.api \
            --tag ${{ steps.meta.outputs.api_image }} \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            ./backend

      - name: Build and Tag Worker image
        run: |
          docker build \
            --file backend/Dockerfile.worker \
            --tag ${{ steps.meta.outputs.worker_image }} \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            ./backend

      - name: Push images to ECR
        run: |
          docker push ${{ steps.meta.outputs.api_image }}
          docker push ${{ steps.meta.outputs.worker_image }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.api_image }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # -------------------------------------------------------------------
  # Build & Deploy Frontend to S3 + CloudFront
  # -------------------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [build-push]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync static files to S3
        run: |
          aws s3 sync frontend/dist/evidentia/browser/ \
            s3://${{ secrets.FRONTEND_S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

          # HTML must never be cached so updates propagate immediately
          aws s3 cp frontend/dist/evidentia/browser/index.html \
            s3://${{ secrets.FRONTEND_S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} \
            --paths "/*"

  # -------------------------------------------------------------------
  # Deploy Backend to ECS Fargate
  # -------------------------------------------------------------------
  deploy-backend:
    name: Deploy ECS Services
    runs-on: ubuntu-latest
    needs: [build-push]
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update ECS API service
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.ECS_API_SERVICE }} \
            --force-new-deployment

      - name: Update ECS Worker service
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.ECS_WORKER_SERVICE }} \
            --force-new-deployment

      - name: Wait for API service stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --services ${{ secrets.ECS_API_SERVICE }}

  # -------------------------------------------------------------------
  # Smoke Test & Verification
  # -------------------------------------------------------------------
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Run Smoke Tests
        run: |
          echo "Waiting 20 seconds for tasks to warm up..."
          sleep 20

          curl -sf https://${{ secrets.API_DOMAIN }}/health || exit 1
          curl -sf https://${{ secrets.API_DOMAIN }}/ready || exit 1

          echo "Smoke test passed: /health and /ready returned HTTP 200"
