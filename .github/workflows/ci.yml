# Evidentia CI Pipeline
#
# Runs comprehensive verification on every push and pull request:
# - Go formatting, static analysis (vet), compilation, and unit tests
# - Race detection (go test -race) on Ubuntu runner
# - Angular production build
# - Production Dockerfile verification (API, Worker, Frontend)
# - Terraform format & syntax validation

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (fmt, vet, build, test, race)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt (must be clean)
        run: |
          diff <(gofmt -l .) <(printf '')

      - name: go vet
        run: go vet ./...

      - name: go build (all binaries)
        run: go build -trimpath -o /dev/null ./cmd/server ./cmd/worker ./cmd/migrate ./cmd/devuser

      - name: go test (unit test suite)
        run: go test ./...

      - name: go test -race (data race detection)
        run: go test -race ./pkg/... ./internal/config/... ./internal/middleware/... ./internal/logger/... ./internal/auth/... ./internal/authz/...

      - name: govulncheck (known Go vulnerabilities)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Production build
        run: npm run build

  terraform:
    name: Terraform (fmt & validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform Validate Production
        run: |
          cd infra/terraform/environments/production
          terraform init -backend=false
          terraform validate

  docker:
    name: Docker (build validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API Dockerfile
        run: docker build -f backend/Dockerfile.api -t evidentia-api:test ./backend

      - name: Build Worker Dockerfile
        run: docker build -f backend/Dockerfile.worker -t evidentia-worker:test ./backend

      - name: Build Frontend Dockerfile
        run: docker build -t evidentia-frontend:test ./frontend
