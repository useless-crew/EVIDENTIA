################################################################################
# Evidentia Hyperledger Fabric Network — configtx.yaml
#
# Three-organization permissioned blockchain:
#   PoliceMSP   — submits evidence anchoring transactions (backend process)
#   ForensicsMSP — forensic lab endorsers (optional second org)
#   CourtMSP    — court/verification reader (optional third org)
#
# Channel: evidentia-channel
# Chaincode: evidentia (Go, deployed under chaincode/evidentia/)
#
# Generate artifacts:
#   configtxgen -profile EvidentiaGenesis -channelID system-channel \
#               -outputBlock genesis.block
#   configtxgen -profile EvidentiaChannel -channelID evidentia-channel \
#               -outputCreateChannelTx evidentia-channel.tx
################################################################################

Organizations:
  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: crypto-config/ordererOrganizations/orderer.evidentia.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"

  - &Police
    Name: PoliceMSP
    ID: PoliceMSP
    MSPDir: crypto-config/peerOrganizations/police.evidentia.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('PoliceMSP.admin', 'PoliceMSP.peer', 'PoliceMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('PoliceMSP.admin', 'PoliceMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('PoliceMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('PoliceMSP.peer')"
    AnchorPeers:
      - Host: peer0.police.evidentia.local
        Port: 7051

  - &Forensics
    Name: ForensicsMSP
    ID: ForensicsMSP
    MSPDir: crypto-config/peerOrganizations/forensics.evidentia.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('ForensicsMSP.admin', 'ForensicsMSP.peer', 'ForensicsMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('ForensicsMSP.admin', 'ForensicsMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('ForensicsMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('ForensicsMSP.peer')"
    AnchorPeers:
      - Host: peer0.forensics.evidentia.local
        Port: 8051

  - &Court
    Name: CourtMSP
    ID: CourtMSP
    MSPDir: crypto-config/peerOrganizations/court.evidentia.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('CourtMSP.admin', 'CourtMSP.peer', 'CourtMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('CourtMSP.admin', 'CourtMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('CourtMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('CourtMSP.peer')"
    AnchorPeers:
      - Host: peer0.court.evidentia.local
        Port: 9051

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_5: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  Addresses:
    - orderer.evidentia.local:7050
  EtcdRaft:
    Consenters:
      - Host: orderer.evidentia.local
        Port: 7050
        ClientTLSCert: crypto-config/ordererOrganizations/orderer.evidentia.local/orderers/orderer.evidentia.local/tls/server.crt
        ServerTLSCert: crypto-config/ordererOrganizations/orderer.evidentia.local/orderers/orderer.evidentia.local/tls/server.crt
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  Capabilities:
    <<: *OrdererCapabilities

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  EvidentiaGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
    Consortiums:
      EvidentiaConsortium:
        Organizations:
          - *Police
          - *Forensics
          - *Court

  EvidentiaChannel:
    Consortium: EvidentiaConsortium
    <<: *ChannelDefaults
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *Police
        - *Forensics
        - *Court
      Capabilities:
        <<: *ApplicationCapabilities
