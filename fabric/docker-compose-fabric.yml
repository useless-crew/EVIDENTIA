################################################################################
# Evidentia Hyperledger Fabric network — docker-compose-fabric.yml
#
# Starts a minimal single-orderer, three-peer Fabric 2.5 LTS network for
# development and integration testing. Run AFTER generating crypto material:
#
#   cd fabric/network
#   cryptogen generate --config=crypto-config.yaml --output=crypto-config
#   configtxgen -profile EvidentiaGenesis -channelID system-channel \
#               -outputBlock genesis.block
#   configtxgen -profile EvidentiaChannel -channelID evidentia-channel \
#               -outputCreateChannelTx evidentia-channel.tx
#   cd ..
#   docker compose -f docker-compose-fabric.yml up -d
#
# Then run scripts/fabric-bootstrap.sh to create the channel, join peers,
# deploy the evidentia chaincode, and copy the backend's MSP identity files.
################################################################################

version: '3.8'

volumes:
  orderer.evidentia.local:
  peer0.police.evidentia.local:
  peer0.forensics.evidentia.local:
  peer0.court.evidentia.local:

networks:
  evidentia-fabric:
    name: evidentia-fabric

services:

  orderer.evidentia.local:
    container_name: orderer.evidentia.local
    image: hyperledger/fabric-orderer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_OPERATIONS_LISTENADDRESS=orderer.evidentia.local:9443
    working_dir: /root
    command: orderer
    volumes:
      - ./network/crypto-config/ordererOrganizations/orderer.evidentia.local/orderers/orderer.evidentia.local/msp:/var/hyperledger/orderer/msp
      - ./network/crypto-config/ordererOrganizations/orderer.evidentia.local/orderers/orderer.evidentia.local/tls:/var/hyperledger/orderer/tls
      - orderer.evidentia.local:/var/hyperledger/production/orderer
    ports:
      - 7050:7050
      - 7053:7053
      - 9443:9443
    networks:
      - evidentia-fabric

  peer0.police.evidentia.local:
    container_name: peer0.police.evidentia.local
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=evidentia-fabric
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.police.evidentia.local
      - CORE_PEER_ADDRESS=peer0.police.evidentia.local:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.police.evidentia.local:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.police.evidentia.local:7051
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.police.evidentia.local:7051
      - CORE_PEER_LOCALMSPID=PoliceMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer0.police.evidentia.local:9444
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./network/crypto-config/peerOrganizations/police.evidentia.local/peers/peer0.police.evidentia.local/msp:/etc/hyperledger/fabric/msp
      - ./network/crypto-config/peerOrganizations/police.evidentia.local/peers/peer0.police.evidentia.local/tls:/etc/hyperledger/fabric/tls
      - peer0.police.evidentia.local:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    ports:
      - 7051:7051
      - 9444:9444
    networks:
      - evidentia-fabric

  peer0.forensics.evidentia.local:
    container_name: peer0.forensics.evidentia.local
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=evidentia-fabric
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.forensics.evidentia.local
      - CORE_PEER_ADDRESS=peer0.forensics.evidentia.local:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.forensics.evidentia.local:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.forensics.evidentia.local:8051
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.forensics.evidentia.local:8051
      - CORE_PEER_LOCALMSPID=ForensicsMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer0.forensics.evidentia.local:9445
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./network/crypto-config/peerOrganizations/forensics.evidentia.local/peers/peer0.forensics.evidentia.local/msp:/etc/hyperledger/fabric/msp
      - ./network/crypto-config/peerOrganizations/forensics.evidentia.local/peers/peer0.forensics.evidentia.local/tls:/etc/hyperledger/fabric/tls
      - peer0.forensics.evidentia.local:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    ports:
      - 8051:8051
      - 9445:9445
    networks:
      - evidentia-fabric

  peer0.court.evidentia.local:
    container_name: peer0.court.evidentia.local
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=evidentia-fabric
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.court.evidentia.local
      - CORE_PEER_ADDRESS=peer0.court.evidentia.local:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.court.evidentia.local:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.court.evidentia.local:9051
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.court.evidentia.local:9051
      - CORE_PEER_LOCALMSPID=CourtMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer0.court.evidentia.local:9446
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./network/crypto-config/peerOrganizations/court.evidentia.local/peers/peer0.court.evidentia.local/msp:/etc/hyperledger/fabric/msp
      - ./network/crypto-config/peerOrganizations/court.evidentia.local/peers/peer0.court.evidentia.local/tls:/etc/hyperledger/fabric/tls
      - peer0.court.evidentia.local:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    ports:
      - 9051:9051
      - 9446:9446
    networks:
      - evidentia-fabric

  # Fabric CLI — used only by scripts/fabric-bootstrap.sh to create the
  # channel, join peers, and deploy the chaincode. Not needed at runtime.
  cli:
    container_name: cli
    image: hyperledger/fabric-tools:2.5
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.police.evidentia.local:7051
      - CORE_PEER_LOCALMSPID=PoliceMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/police.evidentia.local/peers/peer0.police.evidentia.local/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/police.evidentia.local/peers/peer0.police.evidentia.local/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/police.evidentia.local/peers/peer0.police.evidentia.local/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/police.evidentia.local/users/Admin@police.evidentia.local/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./network/crypto-config:/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto
      - ./network:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
      - ../chaincode:/opt/gopath/src/chaincode
    networks:
      - evidentia-fabric
