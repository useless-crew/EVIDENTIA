<div class="modal-backdrop" (click)="close()">
  <div class="modal-dialog" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title-group">
        <h2 class="modal-title">Reset Password</h2>
        <span class="modal-subtitle">{{ user.first_name }} {{ user.last_name }} · {{ user.email }}</span>
      </div>
      <button type="button" class="btn-close" (click)="close()">×</button>
    </div>

    <div class="modal-body">
      <div *ngIf="errorMessage()" class="form-alert-error">{{ errorMessage() }}</div>

      <form (ngSubmit)="submit()" class="pw-form">
        <div class="form-group">
          <label class="form-label">NEW PASSWORD</label>
          <input type="password" class="form-input font-mono" [(ngModel)]="password" name="password" placeholder="At least 8 characters" [disabled]="submitting()" required />
        </div>
        <p class="form-hint">This immediately revokes every one of this user's active sessions.</p>
      </form>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn-secondary" (click)="close()" [disabled]="submitting()">Cancel</button>
      <button type="button" class="btn-primary" (click)="submit()" [disabled]="submitting()">
        {{ submitting() ? 'Resetting…' : 'Reset Password' }}
      </button>
    </div>
  </div>
</div>
