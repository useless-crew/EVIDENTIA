<!-- National Tricolor Bar -->
<div class="tricolor-ribbon" aria-hidden="true">
  <div class="stripe-saffron"></div>
  <div class="stripe-white"></div>
  <div class="stripe-green"></div>
</div>

<!-- Main Executive Navy Header -->
<header class="header">
  <div class="header-inner">
    <!-- Brand Identity -->
    <div class="brand" (click)="dms.navigateTo('dash')">
      <div class="seal-badge" aria-hidden="true">
        <span class="seal-text">SEAL</span>
      </div>
      <div class="brand-text">
        <span class="brand-name">EVIDENTIA</span>
        <span class="brand-tagline">Secure Digital DMS · India Justice Network</span>
      </div>
    </div>

    <!-- Search Input -->
    <div class="search-bar">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="text"
        placeholder="Search cases, documents, hashes (SHA-256)..."
        class="search-input"
      />
    </div>

    <div class="header-spacer"></div>

    <!-- Actions & Personnel Info -->
    <div class="header-actions">
      <!-- Notification Bell -->
      <div class="notification-wrap" title="System Notifications">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="notification-indicator"></span>
      </div>

      <!-- Officer Profile Badge -->
      <div class="user-profile" [title]="'Logged in as ' + (dms.currentUser()?.name || 'User') + ' · ' + (dms.currentUser()?.email || '')">
        <div class="user-avatar">{{ dms.currentUser()?.initials || '—' }}</div>
        <div class="user-meta">
          <div class="user-name">{{ dms.currentUser()?.name || 'Unknown user' }}</div>
          <div class="user-role-badge">{{ dms.role() }}</div>
        </div>
      </div>

      <!-- Sign Out -->
      <button type="button" class="btn-logout" (click)="signOut()">
        Sign Out
      </button>
    </div>
  </div>
</header>
