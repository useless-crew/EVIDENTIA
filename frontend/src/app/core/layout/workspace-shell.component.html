<div class="app-workspace">
  <!-- Top Navigation Bar -->
  <app-header></app-header>

  <div class="workspace-body">
    <!-- Left Navigation Sidebar -->
    <app-sidebar></app-sidebar>

    <!-- Main Dynamic Content Workspace -->
    <main class="workspace-content" #contentArea>
      <div class="workspace-inner">
        <!-- Breadcrumb Bar -->
        <nav class="workspace-breadcrumb" aria-label="Breadcrumb">
          <span class="crumb-mark" aria-hidden="true"></span>
          <span class="crumb-path">{{ dms.breadcrumb() }}</span>
        </nav>

        <!-- Active Screen View Container -->
        <div class="screen-container">
          <router-outlet></router-outlet>
        </div>
      </div>

      <!-- Official Trust & Regulatory Footer -->
      <footer class="workspace-footer">
        <div class="workspace-inner footer-inner">
          <span class="footer-trust-left">
            Official Document Management System · Government of India Evidence Infrastructure
          </span>
          <span class="footer-trust-right">
            Node: NCRB-DMS-02 · IST · All activity is hash-sealed under §65B IT Act
          </span>
        </div>
      </footer>
    </main>
  </div>

  <!-- Document Upload & Fingerprinting Modal -->
  <app-upload-modal *ngIf="dms.uploadOpen()"></app-upload-modal>
</div>
