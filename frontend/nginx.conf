# Evidentia frontend static file server (System 17).
#
# Serves the compiled Angular SPA only — API routing, TLS termination,
# and SSE-specific proxying all live one hop further out, at the reverse
# proxy (see ../ops/reverse-proxy/nginx.conf). This container is never
# reached directly by a browser in production.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip static text assets — JS/CSS bundles are the bulk of an Angular
    # build's transfer size.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
        application/xml image/svg+xml font/woff2;

    # SPA routing: any path that isn't a real static file falls back to
    # index.html so Angular's router (not this server) resolves it —
    # e.g. a hard reload on /app/cases/<uuid> must still serve the app
    # shell, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build filenames (Angular's default output naming) are safe to
    # cache indefinitely; index.html itself must always be revalidated so
    # a new deployment is picked up on next load rather than served stale
    # from a browser/intermediary cache.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Defense in depth — the reverse proxy sets the authoritative
    # production security headers (HSTS, CSP, etc. — see
    # ../ops/reverse-proxy/nginx.conf); these apply even if this
    # container is ever reached directly (e.g. during local testing of
    # the frontend image in isolation).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
}
