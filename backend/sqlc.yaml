# Evidentia — sqlc Configuration Skeleton
#
# TODO: Verify schema/query paths once migrations and queries are finalized.
# This is a skeleton only — no code has been generated from it yet.

version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema: "db/migrations"
    gen:
      go:
        package: "generated"
        out: "db/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_exact_table_names: false
